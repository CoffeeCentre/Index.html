[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — the app uses state-based routing, so every URL should serve
# index.html and let React render the right page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed JS/CSS Vite emits to dist/assets/*
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
