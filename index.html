<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Centre London — Specialty Coffee &amp; Equipment</title>
    <!-- Favicons (also used by Google Search result listings — needs a
         crawlable square icon of at least 48px referenced in the head) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection at deploy time. The React
         NewsletterModal POSTs to / with the same field names. Submissions
         appear in Netlify dashboard → Forms, and email notifications are
         configured under Site settings → Forms → Form notifications. -->
    <form name="newsletter" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="text" name="topics" />
      <input type="text" name="includeOffers" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
