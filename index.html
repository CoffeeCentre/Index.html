<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Centre London — Specialty Coffee &amp; Equipment</title>
    <meta
      name="description"
      content="Specialty coffee roastery and equipment supplier in Forest Hill, London. Freshly roasted coffee, home &amp; commercial gear, SCA &amp; CQI training, and café consulting."
    />
    <link rel="canonical" href="https://coffeecentrelondon.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#b32626" />

    <!-- Open Graph (link previews on Facebook, WhatsApp, iMessage, Slack, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coffee Centre London" />
    <meta property="og:title" content="Coffee Centre London — Specialty Coffee &amp; Equipment" />
    <meta
      property="og:description"
      content="Specialty coffee roastery and equipment supplier in Forest Hill, London. Freshly roasted coffee, home &amp; commercial gear, SCA &amp; CQI training, and café consulting."
    />
    <meta property="og:url" content="https://coffeecentrelondon.com/" />
    <meta property="og:image" content="https://coffeecentrelondon.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coffee Centre London" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coffee Centre London — Specialty Coffee &amp; Equipment" />
    <meta
      name="twitter:description"
      content="Specialty coffee roastery and equipment supplier in Forest Hill, London. Freshly roasted coffee, home &amp; commercial gear, SCA &amp; CQI training, and café consulting."
    />
    <meta name="twitter:image" content="https://coffeecentrelondon.com/og-image.jpg" />

    <!-- Favicons (also used by Google Search result listings — needs a
         crawlable square icon of at least 48px referenced in the head) -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms detection at deploy time. The React
         NewsletterModal POSTs to / with the same field names. Submissions
         appear in Netlify dashboard → Forms, and email notifications are
         configured under Site settings → Forms → Form notifications. -->
    <form name="newsletter" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="text" name="topics" />
      <input type="text" name="includeOffers" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
